name: Release Validate

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  validate-release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Add uv to PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install Task
        uses: go-task/setup-task@v2
        with:
          version: "3.53.1"

      - name: Sync dependencies
        run: task repo:sync

      - name: Verify
        run: task quality:verify

      - name: Render test
        run: task render:test

      - name: Published render test
        env:
          PYTHON_REPO_TEMPLATE_PUBLISHED_SOURCE: "gh:${{ github.repository }}"
          PYTHON_REPO_TEMPLATE_PUBLISHED_REF: "${{ github.ref_name }}"
        run: task render:published
