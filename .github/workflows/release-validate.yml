name: Release Validate

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  validate-release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Add uv to PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Sync dependencies
        run: uv sync --group dev

      - name: Verify
        run: uv run poe verify

      - name: Render test
        run: uv run poe render-test

      - name: Published render test
        env:
          PYTHON_REPO_TEMPLATE_PUBLISHED_SOURCE: "gh:${{ github.repository }}"
          PYTHON_REPO_TEMPLATE_PUBLISHED_REF: "${{ github.ref_name }}"
        run: uv run poe render-test-published
